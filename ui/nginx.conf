# Local gateway for docker compose: one origin for the browser, so the session
# cookie set by the ledger service is also sent to the settlement service.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Balances, settle-up and payments belong to the settlement service.
    location ~ ^/api/groups/[0-9]+/(settlement|payments)$ {
        proxy_pass http://settlement:8000;
    }

    # Everything else under /api (accounts, groups, expenses) is the ledger service.
    location /api/ {
        proxy_pass http://ledger:8000;
    }
}
