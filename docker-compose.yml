# The whole system locally: cp .env.example .env, then docker compose up --build
# and open http://localhost:8080. The first start takes about a minute because
# SQL Server must be healthy before db-init and the services can start.
name: tabby

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # no arm64 image: on Apple Silicon enable Rosetta in Docker Desktop
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?copy .env.example to .env}
    volumes:
      - sqldata:/var/opt/mssql   # the data survives docker compose down (but not down -v)
    ports:
      - "1433:1433"   # lets tests and a single service run from the host (see README)
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # One-off job: creates the two databases and logins (idempotent), then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD:?copy .env.example to .env}
      SETTLEMENT_DB_PASSWORD: ${SETTLEMENT_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P "$$SA_PASSWORD" -i /init.sql -v LEDGER_DB_PASSWORD="$$LEDGER_DB_PASSWORD" SETTLEMENT_DB_PASSWORD="$$SETTLEMENT_DB_PASSWORD"

  ledger:
    build: services/ledger
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://ledger_user:${LEDGER_DB_PASSWORD}@sqlserver:1433/ledger
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8001:8000"

  # Settlement does not wait for ledger: it starts and serves /health on its
  # own, and answers 503 on the cross-seam calls while ledger is down.
  settlement:
    build: services/settlement
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://settlement_user:${SETTLEMENT_DB_PASSWORD}@sqlserver:1433/settlement
      LEDGER_URL: http://ledger:8000   # the compose service name, not localhost
      LEDGER_TIMEOUT_S: "5"
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8002:8000"

  # Stock image with the folder mounted: static files, not a service container.
  # ui/config.js points the browser at localhost:8001 and localhost:8002.
  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  sqldata:
