name: CI

on:
  push:
  pull_request:
  workflow_call:            # lets a deploy workflow reuse this one

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ledger, settlement]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=tabby --cov-fail-under=70

  images:
    needs: test             # no image is built from a commit whose tests failed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets GITHUB_TOKEN push to ghcr.io
    strategy:
      matrix:
        service: [ledger, settlement]
    steps:
      - uses: actions/checkout@v4
      # Image names must be lowercase, and the owner name (SergeGod) is not.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every push and pull request builds; only main publishes, tagged with the commit SHA.
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/tabby-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
